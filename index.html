<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Heimat"/>
<meta name="theme-color" content="#0b0e1a"/>
<title>Heimat</title>
<script>window.HEIMAT_VERSION="V0.2";</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
input,select,button,textarea{font-family:inherit;font-size:16px;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
input:focus,select:focus,textarea:focus{outline:none}
::-webkit-scrollbar{display:none}
select{-webkit-appearance:none}
@keyframes hFade{from{opacity:0}to{opacity:1}}
@keyframes hRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes hSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes hSpin{to{transform:rotate(360deg)}}
.h-press{transition:transform .12s ease}
.h-press:active{transform:scale(.96)}
.h-stagger>*{animation:hRise .24s cubic-bezier(.22,1,.36,1) both}
.h-stagger>*:nth-child(2){animation-delay:30ms}
.h-stagger>*:nth-child(3){animation-delay:60ms}
.h-stagger>*:nth-child(4){animation-delay:90ms}
.h-stagger>*:nth-child(n+5){animation-delay:120ms}
.h-lbl{display:block;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin:18px 2px 8px}
.h-spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:99px;animation:hSpin .7s linear infinite}
</style>
</head>
<body>
<div id="root"><div style="font-family:-apple-system,sans-serif;padding:40px 24px;text-align:center;color:#8B90A8;font-size:15px;line-height:1.6">Loading Heimat…</div></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;

/* ============ SUPABASE ============ */
const SB_URL="https://vqvycbzrkeeuuhgrkpbf.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxdnljYnpya2VldXVoZ3JrcGJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MzM3NzMsImV4cCI6MjA5NzEwOTc3M30.0Bn6csEzn3IVpsaNtAhbIcW4kL2XKFVPHwBK2m6zTZU";
const sb=(window.supabase&&window.supabase.createClient)?window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;

/* ============ THEME ============ */
const DK={bg:"#0b0e1a",card:"#161a2e",cardH:"#1e2236",border:"#262b45",txt:"#ffffff",txt2:"#8b90a8",txt3:"#565c78",acc:"#7c8cf8",green:"#4ade80",red:"#fb7185",amber:"#fbbf24",inp:"#1e2236"};
const LT={bg:"#f4f5fb",card:"#ffffff",cardH:"#eef0f8",border:"#e3e6f0",txt:"#0b0e1a",txt2:"#6b7194",txt3:"#9aa0bd",acc:"#4f5bd5",green:"#16a34a",red:"#e11d48",amber:"#d97706",inp:"#ffffff"};

/* ============ DATA ============ */
const COUNTRIES=[
 {n:"India",c:"INR",f:"🇮🇳"},{n:"China",c:"CNY",f:"🇨🇳"},{n:"Pakistan",c:"PKR",f:"🇵🇰"},
 {n:"Nigeria",c:"NGN",f:"🇳🇬"},{n:"Turkey",c:"TRY",f:"🇹🇷"},{n:"Iran",c:"IRR",f:"🇮🇷"},
 {n:"Bangladesh",c:"BDT",f:"🇧🇩"},{n:"Indonesia",c:"IDR",f:"🇮🇩"},{n:"Egypt",c:"EGP",f:"🇪🇬"},
 {n:"Brazil",c:"BRL",f:"🇧🇷"},{n:"Vietnam",c:"VND",f:"🇻🇳"},{n:"Mexico",c:"MXN",f:"🇲🇽"},
 {n:"Russia",c:"RUB",f:"🇷🇺"},{n:"Ukraine",c:"UAH",f:"🇺🇦"},{n:"Morocco",c:"MAD",f:"🇲🇦"},
 {n:"Ghana",c:"GHS",f:"🇬🇭"},{n:"Kenya",c:"KES",f:"🇰🇪"},{n:"Philippines",c:"PHP",f:"🇵🇭"},
 {n:"Nepal",c:"NPR",f:"🇳🇵"},{n:"Sri Lanka",c:"LKR",f:"🇱🇰"},{n:"Colombia",c:"COP",f:"🇨🇴"},
 {n:"Argentina",c:"ARS",f:"🇦🇷"},{n:"South Africa",c:"ZAR",f:"🇿🇦"},{n:"Thailand",c:"THB",f:"🇹🇭"},
 {n:"Malaysia",c:"MYR",f:"🇲🇾"},{n:"Saudi Arabia",c:"SAR",f:"🇸🇦"},{n:"United States",c:"USD",f:"🇺🇸"},
 {n:"United Kingdom",c:"GBP",f:"🇬🇧"},{n:"Uzbekistan",c:"UZS",f:"🇺🇿"},{n:"Georgia",c:"GEL",f:"🇬🇪"},
 {n:"Other / not listed",c:"USD",f:"🌍"},
];
const HOSTS=[
 {n:"Germany",c:"EUR",f:"🇩🇪"},{n:"Austria",c:"EUR",f:"🇦🇹"},{n:"Netherlands",c:"EUR",f:"🇳🇱"},
 {n:"France",c:"EUR",f:"🇫🇷"},{n:"Italy",c:"EUR",f:"🇮🇹"},{n:"Spain",c:"EUR",f:"🇪🇸"},
 {n:"United Kingdom",c:"GBP",f:"🇬🇧"},{n:"United States",c:"USD",f:"🇺🇸"},{n:"Canada",c:"CAD",f:"🇨🇦"},
 {n:"Switzerland",c:"CHF",f:"🇨🇭"},{n:"Sweden",c:"SEK",f:"🇸🇪"},{n:"Australia",c:"AUD",f:"🇦🇺"},
 {n:"Poland",c:"PLN",f:"🇵🇱"},{n:"Ireland",c:"EUR",f:"🇮🇪"},
];
const CATS=[
 {id:"rent",label:"Rent",icon:"🏠"},{id:"groceries",label:"Groceries",icon:"🛒"},
 {id:"utilities",label:"Utilities",icon:"💡"},{id:"internet",label:"Internet",icon:"📶"},
 {id:"eatout",label:"Eating out",icon:"🍽️"},{id:"transport",label:"Transport",icon:"🚆"},
 {id:"household",label:"Household",icon:"🧻"},{id:"other",label:"Other",icon:"📦"},
];
const cat=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];

const LS={g:k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}},
 s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const tod=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
const haptic=(ms=10)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch{}};
const money=(v,code)=>{try{return new Intl.NumberFormat(undefined,{style:"currency",currency:code,maximumFractionDigits:2}).format(v||0)}catch{return (v||0).toFixed(2)+" "+code}};

/* ============ SMALL UI ============ */
function Sheet({open,onClose,title,T,children}){
 if(!open)return null;
 return(<div style={{position:"fixed",inset:0,zIndex:300}}>
  <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.55)",animation:"hFade .2s ease"}} onClick={onClose}/>
  <div style={{position:"absolute",bottom:0,left:0,right:0,background:T.card,borderRadius:"22px 22px 0 0",paddingBottom:"calc(env(safe-area-inset-bottom) + 14px)",maxHeight:"calc(100vh - env(safe-area-inset-top) - 32px)",display:"flex",flexDirection:"column",animation:"hSheet .3s cubic-bezier(.22,1,.36,1)"}}>
   <div style={{width:36,height:4,background:T.border,borderRadius:99,margin:"12px auto 2px"}}/>
   <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 20px",borderBottom:`1px solid ${T.border}`}}>
    <span style={{fontWeight:700,fontSize:18,color:T.txt}}>{title}</span>
    <button onClick={onClose} style={{background:T.cardH,border:"none",borderRadius:99,width:32,height:32,color:T.txt2,fontSize:18,cursor:"pointer"}}>✕</button>
   </div>
   <div style={{overflowY:"auto",padding:"16px 20px 4px"}}>{children}</div>
  </div>
 </div>);
}
function Field({label,T,children}){return <div style={{marginBottom:14}}><div style={{fontSize:12,fontWeight:600,color:T.txt2,marginBottom:6}}>{label}</div>{children}</div>;}
const inpStyle=T=>({width:"100%",background:T.inp,color:T.txt,border:`1px solid ${T.border}`,borderRadius:12,padding:"12px 14px",fontSize:16});
function Ring({pct,size=74,stroke=8,color,track,children}){
 const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-Math.min(Math.max(pct||0,0),1));
 return(<div style={{position:"relative",width:size,height:size,flexShrink:0}}>
  <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
   <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={track} strokeWidth={stroke}/>
   <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off} style={{transition:"stroke-dashoffset .7s cubic-bezier(.22,1,.36,1)"}}/>
  </svg>
  {children!=null&&<div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>{children}</div>}
 </div>);
}
function Row({T,k,v,last}){return <div style={{display:"flex",justifyContent:"space-between",padding:"12px 0",borderBottom:last?"none":`1px solid ${T.border}`}}><span style={{color:T.txt2,fontSize:14}}>{k}</span><span style={{fontWeight:600,fontSize:14}}>{v}</span></div>;}

/* ============ ONBOARDING ============ */
function Onboarding({T,onDone}){
 const [step,setStep]=useState(0);
 const [name,setName]=useState("");const [home,setHome]=useState(COUNTRIES[0].n);
 const [host,setHost]=useState(HOSTS[0].n);const [rate,setRate]=useState("");const [fetching,setFetching]=useState(false);
 const homeObj=COUNTRIES.find(c=>c.n===home)||COUNTRIES[0];
 const hostObj=HOSTS.find(c=>c.n===host)||HOSTS[0];
 const fetchRate=async()=>{setFetching(true);try{const r=await fetch(`https://open.er-api.com/v6/latest/${hostObj.c}`);const d=await r.json();const v=d&&d.rates&&d.rates[homeObj.c];if(v)setRate(String(Math.round(v*100)/100));}catch{}setFetching(false);};
 useEffect(()=>{if(step===2&&!rate&&homeObj.c!==hostObj.c)fetchRate();},[step]);
 const slides=[
  {icon:"👋",title:"Welcome to Heimat",body:"Your money-and-life companion as an international student abroad. Split costs with flatmates, track how long your money lasts, and stay under your work-hour limit — in your currency."},
  {icon:"🏠",title:"How it works",body:"① Create a flat and invite flatmates with a code — shared bills sync between your phones live.\n\n② Track your funds runway and see how many months your money lasts.\n\n③ Log work shifts so you never cross the legal hour-limit.\n\nYour personal money stays on your phone. Only the shared flat is synced."},
 ];
 if(step<2){const s=slides[step];return(
  <div style={{position:"fixed",inset:0,background:T.bg,zIndex:1000,display:"flex",flexDirection:"column",padding:"calc(env(safe-area-inset-top) + 30px) 28px calc(env(safe-area-inset-bottom) + 30px)",animation:"hFade .3s ease"}}>
   <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center"}}>
    <div style={{fontSize:64,marginBottom:24}}>{s.icon}</div>
    <div style={{fontSize:30,fontWeight:800,letterSpacing:-.8,color:T.txt,marginBottom:16,lineHeight:1.15}}>{s.title}</div>
    <div style={{fontSize:16,color:T.txt2,lineHeight:1.6,whiteSpace:"pre-line"}}>{s.body}</div>
   </div>
   <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:22}}>{[0,1,2].map(i=><div key={i} style={{width:i===step?22:7,height:7,borderRadius:99,background:i===step?T.acc:T.border,transition:"width .25s"}}/>)}</div>
   <div style={{display:"flex",gap:12}}>
    {step>0&&<button onClick={()=>setStep(step-1)} className="h-press" style={{flex:1,background:T.card,color:T.txt,border:"none",borderRadius:16,padding:"16px",fontSize:16,fontWeight:600,cursor:"pointer"}}>Back</button>}
    <button onClick={()=>{haptic();setStep(step+1);}} className="h-press" style={{flex:2,background:T.acc,color:"#fff",border:"none",borderRadius:16,padding:"16px",fontSize:16,fontWeight:700,cursor:"pointer"}}>Continue</button>
   </div>
  </div>);}
 return(
  <div style={{position:"fixed",inset:0,background:T.bg,zIndex:1000,display:"flex",flexDirection:"column",animation:"hFade .3s ease"}}>
   <div style={{padding:"calc(env(safe-area-inset-top) + 24px) 24px 8px"}}>
    <div style={{fontSize:26,fontWeight:800,letterSpacing:-.6,color:T.txt}}>Set up your profile</div>
    <div style={{fontSize:14,color:T.txt2,marginTop:4}}>So Heimat shows every amount in both currencies.</div>
   </div>
   <div style={{flex:1,overflowY:"auto",padding:"12px 24px"}}>
    <Field label="Your name" T={T}><input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Aarav" style={inpStyle(T)}/></Field>
    <Field label="Home country (your currency)" T={T}><select value={home} onChange={e=>setHome(e.target.value)} style={inpStyle(T)}>{COUNTRIES.map(c=><option key={c.n} value={c.n}>{c.f} {c.n} — {c.c}</option>)}</select></Field>
    <Field label="Where you study (local currency)" T={T}><select value={host} onChange={e=>setHost(e.target.value)} style={inpStyle(T)}>{HOSTS.map(c=><option key={c.n} value={c.n}>{c.f} {c.n} — {c.c}</option>)}</select></Field>
    {homeObj.c!==hostObj.c&&<Field label={`Exchange rate · 1 ${hostObj.c} = ? ${homeObj.c}`} T={T}>
     <div style={{display:"flex",gap:8}}><input value={rate} onChange={e=>setRate(e.target.value)} type="number" inputMode="decimal" placeholder="rate" style={inpStyle(T)}/>
     <button onClick={fetchRate} className="h-press" style={{flexShrink:0,background:T.card,color:T.acc,border:`1px solid ${T.border}`,borderRadius:12,padding:"0 16px",fontSize:14,fontWeight:700,cursor:"pointer"}}>{fetching?"…":"Live rate"}</button></div>
     <div style={{fontSize:11,color:T.txt3,marginTop:6}}>Reference rate only — edit anytime in the Me tab.</div>
    </Field>}
   </div>
   <div style={{padding:"8px 24px calc(env(safe-area-inset-bottom) + 24px)"}}>
    <button disabled={!name.trim()} onClick={()=>{haptic(14);onDone({name:name.trim(),homeCountry:homeObj.n,homeCur:homeObj.c,homeFlag:homeObj.f,hostCountry:hostObj.n,hostCur:hostObj.c,rate:parseFloat(rate)||(homeObj.c===hostObj.c?1:0),onboarded:true});}} className="h-press" style={{width:"100%",background:name.trim()?T.acc:T.border,color:"#fff",border:"none",borderRadius:16,padding:"16px",fontSize:16,fontWeight:700,cursor:name.trim()?"pointer":"default"}}>Start using Heimat</button>
   </div>
  </div>);
}

/* ============ APP ============ */
function App(){
 const [dark,setDark]=useState(()=>{const v=LS.g("mt-h-dark");return v==null?true:v;});
 const T=dark?DK:LT;
 const [profile,setProfile]=useState(()=>LS.g("mt-h-profile")||{onboarded:false});
 const [runway,setRunway]=useState(()=>LS.g("mt-h-runway")||null);
 const [shifts,setShifts]=useState(()=>LS.g("mt-h-shifts")||[]);
 const [tab,setTab]=useState("home");
 const [modal,setModal]=useState(null);
 const [toast,setToast]=useState(null);

 /* sync state */
 const [uid,setUid]=useState(null);
 const [authErr,setAuthErr]=useState(null);
 const [flatId,setFlatId]=useState(()=>LS.g("mt-h-flatid"));
 const [flat,setFlat]=useState(null);
 const [members,setMembers]=useState([]);
 const [expenses,setExpenses]=useState([]);
 const [settles,setSettles]=useState([]);
 const [busy,setBusy]=useState(false);

 const save=(setter,key)=>v=>{setter(v);LS.s(key,v);};
 const sProfile=save(setProfile,"mt-h-profile");
 const sRunway=save(setRunway,"mt-h-runway");
 const sShifts=save(setShifts,"mt-h-shifts");
 const tgDark=()=>{const n=!dark;setDark(n);LS.s("mt-h-dark",n);};
 const showToast=(m)=>{setToast(m);setTimeout(()=>setToast(null),2600);};
 const setFlatIdP=id=>{setFlatId(id);LS.s("mt-h-flatid",id);};

 const hostCur=profile.hostCur||"EUR";const homeCur=profile.homeCur||hostCur;const rate=profile.rate||1;
 const fH=v=>money(v,hostCur);
 const fHome=v=>homeCur===hostCur?null:money(v*rate,homeCur);
 const nameOf=u=>u===uid?"You":(members.find(m=>m.user_id===u)||{}).display_name||"Someone";

 /* auth */
 useEffect(()=>{(async()=>{
  if(!sb){setAuthErr("offline");return;}
  try{
   let {data:{session}}=await sb.auth.getSession();
   if(!session){const {error}=await sb.auth.signInAnonymously();if(error)throw error;({data:{session}}=await sb.auth.getSession());}
   setUid(session.user.id);
  }catch(e){setAuthErr(e.message||"Couldn't connect");}
 })();},[]);

 /* load flat data */
 const loadFlat=async()=>{
  if(!sb||!flatId)return;
  try{
   const [f,m,e,s]=await Promise.all([
    sb.from("flats").select("*").eq("id",flatId).maybeSingle(),
    sb.from("flat_members").select("*").eq("flat_id",flatId),
    sb.from("expenses").select("*").eq("flat_id",flatId).order("spent_on",{ascending:false}),
    sb.from("settlements").select("*").eq("flat_id",flatId),
   ]);
   if(f.data){setFlat(f.data);setMembers(m.data||[]);setExpenses(e.data||[]);setSettles(s.data||[]);}
   else {setFlatIdP(null);setFlat(null);} // membership gone / deleted
  }catch(err){showToast("Sync error — will retry");}
 };
 useEffect(()=>{if(uid&&flatId)loadFlat();else{setFlat(null);setMembers([]);setExpenses([]);setSettles([]);}},[uid,flatId]);

 /* realtime */
 useEffect(()=>{
  if(!sb||!uid||!flatId)return;
  const ch=sb.channel("flat-"+flatId)
   .on("postgres_changes",{event:"*",schema:"public",table:"expenses",filter:"flat_id=eq."+flatId},payload=>{
     if(payload.eventType==="INSERT"&&payload.new&&payload.new.created_by!==uid){
      const e=payload.new;const parts=(e.split_among||[]);const share=parts.includes(uid)?e.amount/Math.max(parts.length,1):0;
      showToast(`${nameOf(e.created_by)} added ${money(e.amount,e.currency||hostCur)}${share?` · you owe ${money(share,e.currency||hostCur)}`:""}`);haptic(14);
     }
     loadFlat();
   })
   .on("postgres_changes",{event:"*",schema:"public",table:"settlements",filter:"flat_id=eq."+flatId},()=>loadFlat())
   .on("postgres_changes",{event:"*",schema:"public",table:"flat_members",filter:"flat_id=eq."+flatId},()=>loadFlat())
   .subscribe();
  return ()=>{try{sb.removeChannel(ch);}catch{}};
 },[uid,flatId,members]);

 /* flat actions */
 const createFlat=async(nm)=>{
  if(!sb||!uid)return showToast("Still connecting…");
  setBusy(true);
  const {data,error}=await sb.rpc("create_flat",{p_name:nm,p_display_name:profile.name||"Me"});
  setBusy(false);
  if(error){showToast(error.message);return;}
  haptic(14);setFlatIdP(data.id);setModal(null);showToast("Flat created");
 };
 const joinFlat=async(code)=>{
  if(!sb||!uid)return showToast("Still connecting…");
  setBusy(true);
  const {data,error}=await sb.rpc("join_flat",{p_code:(code||"").trim().toUpperCase(),p_display_name:profile.name||"Me"});
  setBusy(false);
  if(error){showToast("Invalid code");return;}
  haptic(14);setFlatIdP(data.id);setModal(null);showToast("Joined flat");
 };
 const addExpense=async(x)=>{
  if(!sb||!flatId)return;
  const {error}=await sb.from("expenses").insert({flat_id:flatId,description:x.desc,amount:x.amount,currency:hostCur,paid_by:x.paidBy,split_among:x.among,category:x.category,created_by:uid,spent_on:tod()});
  if(error){showToast(error.message);return;}
  haptic(12);showToast("Expense added");loadFlat();
 };
 const deleteExpense=async(id)=>{const {error}=await sb.from("expenses").delete().eq("id",id);if(!error){showToast("Deleted");loadFlat();}};
 const settleUp=async(from,to,amount)=>{
  const {error}=await sb.from("settlements").insert({flat_id:flatId,from_user:from,to_user:to,amount,created_by:uid,settled_on:tod()});
  if(error){showToast(error.message);return;}
  haptic(12);showToast("Payment recorded");loadFlat();
 };
 const leaveFlat=async()=>{
  if(!confirm("Leave this flat? You'll stop seeing its shared bills."))return;
  await sb.from("flat_members").delete().eq("flat_id",flatId).eq("user_id",uid);
  setFlatIdP(null);showToast("Left flat");
 };

 const finishOnboard=(p)=>sProfile(p);

 /* balances */
 const balances=useMemo(()=>{
  const net={};members.forEach(m=>net[m.user_id]=0);
  expenses.forEach(e=>{if(net[e.paid_by]==null)return;net[e.paid_by]+=e.amount;const parts=(e.split_among&&e.split_among.length)?e.split_among:[e.paid_by];const share=e.amount/parts.length;parts.forEach(u=>{if(net[u]!=null)net[u]-=share;});});
  settles.forEach(s=>{if(net[s.from_user]!=null)net[s.from_user]+=s.amount;if(net[s.to_user]!=null)net[s.to_user]-=s.amount;});
  return net;
 },[members,expenses,settles]);
 const myNet=uid?(balances[uid]||0):0;

 /* runway: driven by my share of flat spending */
 const runwayCalc=useMemo(()=>{
  if(!runway||!runway.total)return null;
  const spentSince=expenses.filter(e=>e.spent_on>=runway.start).reduce((s,e)=>{const parts=(e.split_among&&e.split_among.length)?e.split_among:[e.paid_by];return s+(parts.includes(uid)?e.amount/parts.length:0);},0);
  const left=Math.max(runway.total-spentSince,0);
  const start=new Date(runway.start),now=new Date();
  const monthsElapsed=Math.max((now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth())+now.getDate()/30,0.1);
  const burn=Math.max(spentSince/monthsElapsed,runway.monthly||0,1);
  return {left,monthsLeft:left/burn,burn,spentSince};
 },[runway,expenses,uid]);

 const workStats=useMemo(()=>{
  const yr=tod().slice(0,4);const cur=shifts.filter(s=>s.date.startsWith(yr));
  let full=0,half=0;cur.forEach(s=>{(s.hours>=4)?full++:half++;});
  const now=new Date();const day=(now.getDay()+6)%7;const monday=new Date(now);monday.setDate(now.getDate()-day);
  const mk=`${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,"0")}-${String(monday.getDate()).padStart(2,"0")}`;
  const weekH=shifts.filter(s=>s.date>=mk).reduce((a,s)=>a+(parseFloat(s.hours)||0),0);
  return {daysUsed:full+half*0.5,budget:120,weekH,count:cur.length};
 },[shifts]);

 if(!profile.onboarded)return <div style={{height:"100%",background:T.bg}}><Onboarding T={T} onDone={finishOnboard}/></div>;

 const TABS=[["home","Home","◎"],["flat","Flat","🏠"],["money","Money","€"],["work","Work","⏱"],["me","Me","☺"]];
 const inFlat=!!flat;

 return(

   <div style={{flexShrink:0,paddingTop:"env(safe-area-inset-top)"}}>

    </div>
   </div>

   <div style={{flex:1,overflowY:"auto"}}>
    <div className="h-stagger" style={{padding:"6px 16px calc(env(safe-area-inset-bottom) + 120px)"}}>

     {tab==="home"&&<>
      {inFlat?<>
       <div style={{textAlign:"center",padding:"10px 0 14px"}}>
        <div style={{fontSize:11,fontWeight:700,letterSpacing:1,color:T.txt3,textTransform:"uppercase"}}>Your balance in {flat.name}</div>
        <div style={{fontSize:36,fontWeight:800,letterSpacing:-1.2,marginTop:2,color:myNet>0.5?T.green:myNet<-0.5?T.red:T.txt}}>{myNet>=0?"+":"−"}{fH(Math.abs(myNet))}</div>
        <div style={{fontSize:13,color:T.txt2,marginTop:3}}>{myNet>0.5?"you are owed":myNet<-0.5?"you owe":"all settled up"}{fHome(Math.abs(myNet))?` · ${fHome(Math.abs(myNet))}`:""}</div>
       </div>
       {runwayCalc&&<div onClick={()=>setTab("money")} className="h-press" style={{display:"flex",alignItems:"center",gap:14,background:T.card,borderRadius:20,padding:"15px 16px",marginBottom:12,cursor:"pointer"}}>
        <Ring pct={runwayCalc.monthsLeft/((runway.targetMonths)||12)} size={64} stroke={7} color={runwayCalc.monthsLeft<2?T.red:T.acc} track={T.border}><span style={{fontSize:15,fontWeight:800}}>{Math.floor(runwayCalc.monthsLeft)}</span><span style={{fontSize:8,color:T.txt2}}>mo</span></Ring>
        <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600,color:T.txt2}}>Funds runway</div><div style={{fontSize:19,fontWeight:800,letterSpacing:-.4}}>{fH(runwayCalc.left)} <span style={{fontSize:12,fontWeight:500,color:T.txt3}}>left</span></div><div style={{fontSize:11,color:T.txt3,marginTop:1}}>≈ {runwayCalc.monthsLeft.toFixed(1)} months</div></div>
        <span style={{color:T.txt3,fontSize:16}}>›</span>
       </div>}
       <div style={{display:"flex",gap:10,marginBottom:14}}>
        <button onClick={()=>setModal("exp")} className="h-press" style={{flex:1,background:T.acc,color:"#fff",border:"none",borderRadius:16,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer"}}>+ Shared expense</button>
        <button onClick={()=>setTab("flat")} className="h-press" style={{flex:1,background:T.card,color:T.txt,border:`1px solid ${T.border}`,borderRadius:16,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer"}}>Who owes whom</button>
       </div>
       <span className="h-lbl" style={{color:T.txt3}}>Recent in your flat</span>

        :expenses.slice(0,6).map((e,i)=>{const c=cat(e.category);return <div key={e.id} style={{display:"flex",alignItems:"center",gap:11,padding:"11px 15px",borderTop:i>0?`1px solid ${T.border}`:"none"}}>

         <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:14}}>{e.description||c.label}</div><div style={{fontSize:11,color:T.txt2}}>{nameOf(e.paid_by)} paid · {e.spent_on}</div></div>
         <div style={{textAlign:"right"}}><div style={{fontWeight:700,fontSize:14}}>{fH(e.amount)}</div>{fHome(e.amount)&&<div style={{fontSize:10,color:T.txt3}}>{fHome(e.amount)}</div>}</div>
        </div>;})}
       </div>
      </>:<NoFlat T={T} setModal={setModal} authErr={authErr} uid={uid}/>}
     </>}

     {tab==="flat"&&(inFlat?<FlatTab {...{T,flat,members,balances,uid,fH,nameOf,setModal,leaveFlat,expenses,deleteExpense}}/>:<NoFlat T={T} setModal={setModal} authErr={authErr} uid={uid}/>)}

     {tab==="work"&&<WorkTab {...{T,workStats,setModal}}/>}
     {tab==="me"&&<MeTab {...{T,profile,sProfile,dark,tgDark,showToast,uid,flat,leaveFlat}}/>}
    </div>
   </div>

   <div style={{position:"fixed",left:0,right:0,bottom:0,zIndex:90,paddingBottom:"calc(env(safe-area-inset-bottom) + 8px)",paddingTop:6,background:dark?"rgba(11,14,26,.86)":"rgba(244,245,251,.9)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)",borderTop:`1px solid ${T.border}`}}>
    <div style={{display:"flex",maxWidth:480,margin:"0 auto"}}>
     {TABS.map(([id,label,ic])=>{const on=tab===id;return <button key={id} onClick={()=>{haptic(8);setTab(id);}} style={{flex:1,background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",color:on?T.acc:T.txt3}}><span style={{fontSize:18,lineHeight:1}}>{ic}</span><span style={{fontSize:10,fontWeight:on?700:500}}>{label}</span></button>;})}

   <RunwayModal {...{open:modal==="runway",onClose:()=>setModal(null),T,runway,sRunway,hostCur,showToast}}/>
   <ShiftModal {...{open:modal==="shift",onClose:()=>setModal(null),T,shifts,sShifts,showToast}}/>
  </div>
 );
}

   <Field label="Flat code" T={T}><input value={code} onChange={e=>setCode(e.target.value.toUpperCase())} placeholder="e.g. 4B7K9A" style={{...inpStyle(T),letterSpacing:2,fontWeight:700,textAlign:"center",fontSize:20}}/></Field>
   <button onClick={()=>joinFlat(code)} disabled={busy||code.length<4} className="h-press" style={{width:"100%",background:code.length>=4?T.acc:T.border,color:"#fff",border:"none",borderRadius:16,padding:"16px",fontWeight:700,fontSize:16,cursor:"pointer",display:"flex",justifyContent:"center"}}>{busy?<div className="h-spin"/>:"Join flat"}</button>
   <div style={{fontSize:12,color:T.txt3,textAlign:"center",marginTop:12}}>Ask a flatmate for the code shown in their Flat tab.</div>
  </>:<>
   <Field label="Flat name" T={T}><input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. WG Hauptstraße" style={inpStyle(T)}/></Field>
   <button onClick={()=>createFlat(name)} disabled={busy} className="h-press" style={{width:"100%",background:T.acc,color:"#fff",border:"none",borderRadius:16,padding:"16px",fontWeight:700,fontSize:16,cursor:"pointer",display:"flex",justifyContent:"center"}}>{busy?<div className="h-spin"/>:"Create flat"}</button>
   <div style={{fontSize:12,color:T.txt3,textAlign:"center",marginTop:12}}>You'll get a code to share with your flatmates.</div>
  </>}
 </Sheet>;
}
function InviteModal({open,onClose,T,flat,showToast}){
 if(!flat)return null;
 const url=location.origin+location.pathname;
 const msg=`Join my flat “${flat.name}” on Heimat 🏠\nCode: ${flat.join_code}\nOpen ${url} → tap “Join with a code”.`;
 const share=async()=>{try{if(navigator.share){await navigator.share({title:"Heimat",text:msg});}else{await navigator.clipboard.writeText(msg);showToast("Invite copied");}}catch{}};
 return <Sheet open={open} onClose={onClose} title="Invite flatmates" T={T}>
  <div style={{textAlign:"center",padding:"8px 0 4px"}}>
   <div style={{fontSize:12,color:T.txt2,fontWeight:600}}>Your flat code</div>
   <div style={{fontSize:40,fontWeight:800,letterSpacing:4,color:T.acc,margin:"6px 0 4px"}}>{flat.join_code}</div>
   <div style={{fontSize:13,color:T.txt3,marginBottom:18}}>They open Heimat → Join with a code → type this.</div>
  </div>
  <button onClick={share} className="h-press" style={{width:"100%",background:T.acc,color:"#fff",border:"none",borderRadius:16,padding:"16px",fontWeight:700,fontSize:16,cursor:"pointer",marginBottom:10}}>Share invite</button>
  <button onClick={()=>{navigator.clipboard.writeText(flat.join_code);showToast("Code copied");}} className="h-press" style={{width:"100%",background:T.card,color:T.txt,border:`1px solid ${T.border}`,borderRadius:16,padding:"14px",fontWeight:700,fontSize:15,cursor:"pointer"}}>Copy code only</button>
 </Sheet>;
}
function ExpenseModal({open,onClose,T,members,uid,addExpense,hostCur,homeCur,rate}){
 const [desc,setDesc]=useState("");const [amt,setAmt]=useState("");const [payer,setPayer]=useState(uid||"");
 const [among,setAmong]=useState(members.map(m=>m.user_id));const [c,setC]=useState("groceries");
 useEffect(()=>{if(open){setDesc("");setAmt("");setPayer(uid||"");setAmong(members.map(m=>m.user_id));setC("groceries");}},[open]);
 const v=parseFloat(amt)||0;const toggle=id=>setAmong(a=>a.includes(id)?a.filter(x=>x!==id):[...a,id]);
 const nm=u=>u===uid?"You":(members.find(m=>m.user_id===u)||{}).display_name||"?";
 return <Sheet open={open} onClose={onClose} title="Shared expense" T={T}>
  <Field label="What for?" T={T}><input value={desc} onChange={e=>setDesc(e.target.value)} placeholder="e.g. Rewe groceries" style={inpStyle(T)}/></Field>
  <Field label={`Amount (${hostCur})`} T={T}><input value={amt} onChange={e=>setAmt(e.target.value)} type="number" inputMode="decimal" placeholder="0.00" style={{...inpStyle(T),fontSize:22,fontWeight:700}}/>{homeCur!==hostCur&&v>0&&<div style={{fontSize:12,color:T.txt3,marginTop:6}}>≈ {money(v*rate,homeCur)} in your currency</div>}</Field>
  <Field label="Paid by" T={T}><select value={payer} onChange={e=>setPayer(e.target.value)} style={inpStyle(T)}>{members.map(m=><option key={m.user_id} value={m.user_id}>{nm(m.user_id)}</option>)}</select></Field>
  <Field label="Category" T={T}><div style={{display:"flex",flexWrap:"wrap",gap:8}}>{CATS.map(x=><button key={x.id} onClick={()=>setC(x.id)} style={{background:c===x.id?T.acc:T.inp,color:c===x.id?"#fff":T.txt2,border:`1px solid ${c===x.id?T.acc:T.border}`,borderRadius:99,padding:"7px 12px",fontSize:13,fontWeight:600,cursor:"pointer"}}>{x.icon} {x.label}</button>)}</div></Field>
  <Field label={`Split between (${among.length})`} T={T}>{members.map(m=><div key={m.user_id} onClick={()=>toggle(m.user_id)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 14px",background:T.inp,borderRadius:12,marginBottom:7,cursor:"pointer",border:`1px solid ${among.includes(m.user_id)?T.acc:T.border}`}}><span style={{fontWeight:500}}>{nm(m.user_id)}</span><span style={{color:among.includes(m.user_id)?T.acc:T.txt3,fontWeight:700}}>{among.includes(m.user_id)?`${money(v/Math.max(among.length,1),hostCur)} ✓`:"—"}</span></div>)}</Field>
  <button onClick={()=>{if(!v||among.length===0||!payer)return;addExpense({desc:desc.trim(),amount:v,paidBy:payer,among,category:c});onClose();}} disabled={!v||among.length===0} className="h-press" style={{width:"100%",background:v&&among.length?T.acc:T.border,color:"#fff",border:"none",borderRadius:16,padding:"16px",fontWeight:700,fontSize:16,cursor:"pointer",marginBottom:8}}>Add expense</button>
 </Sheet>;
}
function SettleModal({open,onClose,T,members,balances,uid,nameOf,fH,settleUp}){
 const [from,setFrom]=useState("");const [to,setTo]=useState("");const [amt,setAmt]=useState("");
 useEffect(()=>{if(open){const debtor=members.find(m=>(balances[m.user_id]||0)<-0.5);const creditor=members.find(m=>(balances[m.user_id]||0)>0.5);setFrom(debtor?debtor.user_id:(uid||""));setTo(creditor?creditor.user_id:"");setAmt("");}},[open]);
 return <Sheet open={open} onClose={onClose} title="Settle up" T={T}>
  <Field label="Who pays" T={T}><select value={from} onChange={e=>setFrom(e.target.value)} style={inpStyle(T)}>{members.map(m=><option key={m.user_id} value={m.user_id}>{nameOf(m.user_id)}</option>)}</select></Field>
  <Field label="Pays to" T={T}><select value={to} onChange={e=>setTo(e.target.value)} style={inpStyle(T)}>{members.map(m=><option key={m.user_id} value={m.user_id}>{nameOf(m.user_id)}</option>)}</select></Field>
  <Field label="Amount" T={T}><input value={amt} onChange={e=>setAmt(e.target.value)} type="number" inputMode="decimal" placeholder="0.00" style={inpStyle(T)}/></Field>
  <button onClick={()=>{const v=parseFloat(amt)||0;if(!v||from===to)return;settleUp(from,to,v);onClose();}} className="h-press" style={{width:"100%",background:T.acc,color:"#fff",border:"none",borderRadius:16,padding:"16px",fontWeight:700,fontSize:16,cursor:"pointer"}}>Record payment</button>
 </Sheet>;
}
function RunwayModal({open,onClose,T,runway,sRunway,hostCur,showToast}){
 const [total,setTotal]=useState("");const [start,setStart]=useState(tod());const [monthly,setMonthly]=useState("");const [target,setTarget]=useState("12");
 useEffect(()=>{if(open&&runway){setTotal(String(runway.total||""));setStart(runway.start||tod());setMonthly(String(runway.monthly||""));setTarget(String(runway.targetMonths||12));}else if(open){setTotal("");setStart(tod());setMonthly("");setTarget("12");}},[open]);
 return <Sheet open={open} onClose={onClose} title="Funds runway" T={T}>
  <Field label={`Total funds available (${hostCur})`} T={T}><input value={total} onChange={e=>setTotal(e.target.value)} type="number" inputMode="decimal" placeholder="e.g. 11904" style={{...inpStyle(T),fontSize:20,fontWeight:700}}/></Field>
  <Field label="Counting from" T={T}><input value={start} onChange={e=>setStart(e.target.value)} type="date" style={inpStyle(T)}/></Field>
  <Field label="Must last (months)" T={T}><input value={target} onChange={e=>setTarget(e.target.value)} type="number" inputMode="numeric" style={inpStyle(T)}/></Field>
  <Field label={`Planned monthly minimum (${hostCur}, optional)`} T={T}><input value={monthly} onChange={e=>setMonthly(e.target.value)} type="number" inputMode="decimal" placeholder="e.g. 992" style={inpStyle(T)}/></Field>
  <button onClick={()=>{const t=parseFloat(total)||0;if(!t)return;sRunway({total:t,start,monthly:parseFloat(monthly)||0,targetMonths:parseInt(target)||12});showToast("Runway saved");onClose();}} className="h-press" style={{width:"100%",background:T.acc,color:"#fff",border:"none",borderRadius:16,padding:"16px",fontWeight:700,fontSize:16,cursor:"pointer",marginBottom:8}}>Save runway</button>
  <div style={{fontSize:12,color:T.txt3,textAlign:"center",lineHeight:1.5}}>For a German blocked account this is usually ~€11,904 that must last 12 months (~€992/mo).</div>
 </Sheet>;
}
function ShiftModal({open,onClose,T,shifts,sShifts,showToast}){
 const [date,setDate]=useState(tod());const [hours,setHours]=useState("");const [emp,setEmp]=useState("");
 useEffect(()=>{if(open){setDate(tod());setHours("");setEmp("");}},[open]);
 return <Sheet open={open} onClose={onClose} title="Log work shift" T={T}>
  <Field label="Date" T={T}><input value={date} onChange={e=>setDate(e.target.value)} type="date" style={inpStyle(T)}/></Field>
  <Field label="Hours worked" T={T}><input value={hours} onChange={e=>setHours(e.target.value)} type="number" inputMode="decimal" placeholder="e.g. 6" style={{...inpStyle(T),fontSize:20,fontWeight:700}}/></Field>
  <Field label="Employer (optional)" T={T}><input value={emp} onChange={e=>setEmp(e.target.value)} placeholder="e.g. Café job" style={inpStyle(T)}/></Field>
  <button onClick={()=>{const h=parseFloat(hours)||0;if(!h)return;sShifts([{id:Date.now().toString(36),date,hours:h,employer:emp.trim()},...shifts]);showToast("Shift logged");onClose();}} className="h-press" style={{width:"100%",background:T.acc,color:"#fff",border:"none",borderRadius:16,padding:"16px",fontWeight:700,fontSize:16,cursor:"pointer"}}>Log shift</button>
 </Sheet>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
