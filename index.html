<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Heimat"/>
<meta name="theme-color" content="#0c1110"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<title>Heimat</title>
<script>
/* A password-reset link that lands on the app instead of reset.html — sent by an
   app build from before reset.html existed, or one whose redirect Supabase fell
   back on — is handed over untouched. It has to happen here, before the app
   bundle loads: the Supabase client consumes the token as soon as it starts. */
(function () {
  var p = location.pathname, s = location.search, h = location.hash
  if (!((/[?&]token_hash=/.test(s) && /[?&]type=recovery/.test(s)) || /(^#|&)type=recovery/.test(h))) return
  // Already at reset.html's address means this page was served in its place
  // (a service worker answering the navigation). Forwarding again would only
  // loop, so stop here instead.
  if (/reset\.html$/.test(p)) return
  location.replace(p.replace(/[^/]*$/, '') + 'reset.html' + s + h)
})()
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
