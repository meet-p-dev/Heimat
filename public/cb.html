<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Redirecting…</title>
<!-- Not a Heimat page. This address was MoneyTrack's bank-connection callback,
     because MoneyTrack had no site of its own to put one on. It does now, and
     mt-bank-auth-start sends new consents straight there. This forwards the
     stragglers — a consent already in flight, or a redirect still registered
     against this URL at Enable Banking — with the code untouched, so nobody
     hits a dead end mid-way through connecting a bank. Delete it once no
     traffic arrives here. -->
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0c1110;color:#a3b1ab;display:flex;align-items:center;justify-content:center;min-height:100vh}
p{font-size:14px;text-align:center;padding:0 24px;line-height:1.55}a{color:#3ddc97}</style></head><body>
<p>Taking you to MoneyTrack…<br><a id="l" href="https://meet-p-dev.github.io/refactored-octo-tribble/cb.html">Continue</a></p>
<script>
// carry the whole query string over — the consent code lives in it, and losing
// it would mean starting the bank connection again from scratch
var to = 'https://meet-p-dev.github.io/refactored-octo-tribble/cb.html' + location.search + location.hash;
document.getElementById('l').href = to;
location.replace(to);
</script></body></html>
